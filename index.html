<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0c',
                        cardbg: '#141418',
                        surface: '#1c1c22',
                        accent: '#e5e5e7',
                    },
                    animation: {
                        'subtle-float': 'subtleFloat 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        subtleFloat: {
                            '0%, 100%': { transform: 'scale(1) translateY(0)' },
                            '50%': { transform: 'scale(1.01) translateY(-4px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.15' },
                            '50%': { opacity: '0.35' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .aspect-square-box { aspect-ratio: 1 / 1; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkbg text-zinc-100 min-h-screen flex flex-col selection:bg-zinc-200 selection:text-black">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-darkbg/95 backdrop-blur-xl border-b border-zinc-800/60 px-4 md:px-10 py-4 flex items-center justify-between">
        
        <!-- Navigation Tabs (Dynamic, no names/labels) -->
        <nav class="flex items-center space-x-1 sm:space-x-2 overflow-x-auto no-scrollbar py-1" id="product-tabs">
            <!-- Populated via JS -->
        </nav>

        <div class="flex items-center space-x-3 flex-shrink-0">
            <!-- View Mode Toggle -->
            <div id="view-mode-wrapper" class="bg-surface p-1 rounded-xl border border-zinc-800 flex items-center space-x-1">
                <button onclick="setViewMode('grid')" id="mode-grid-btn" class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-zinc-200 text-black font-semibold shadow">
                    <i class="fa-solid fa-grid-2"></i>
                    <span class="hidden sm:inline">Grid</span>
                </button>
                <button onclick="setViewMode('flipbook')" id="mode-flipbook-btn" class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-book-open-reader"></i>
                    <span class="hidden sm:inline">Flipbook</span>
                </button>
            </div>

            <button onclick="shareCurrentPage()" class="px-3.5 py-2 bg-surface hover:bg-zinc-800 text-zinc-300 text-xs font-medium rounded-xl transition flex items-center space-x-2 border border-zinc-800">
                <i class="fa-solid fa-share-nodes"></i>
                <span class="hidden sm:inline">Share Page</span>
            </button>
        </div>
    </header>

    <!-- Main Content Stage -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 flex flex-col">
        
        <!-- ================= VIEW MODE 1: EDITORIAL GRID ================= -->
        <div id="view-grid" class="space-y-6">
            <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Grid items populated dynamically -->
            </div>
        </div>

        <!-- ================= VIEW MODE 2: CINEMATIC FLIPBOOK INSPECTOR ================= -->
        <div id="view-flipbook" class="hidden grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <!-- Left Column: Main Stage Player -->
            <div class="lg:col-span-7 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-3 px-1">
                    <span id="flipbook-counter" class="text-xs font-mono text-zinc-400 bg-surface px-3 py-1 rounded-lg border border-zinc-800">01 / 01</span>
                </div>

                <!-- Stage Box with 1:1 Aspect Ratio & Breathing Animation -->
                <div class="relative w-full max-w-xl aspect-square-box bg-cardbg rounded-3xl border border-zinc-800/80 shadow-2xl overflow-hidden group flex items-center justify-center p-6">
                    <!-- Ambient Glow -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent animate-pulse-glow pointer-events-none"></div>

                    <!-- Main Image with Subtle Breathing Animation -->
                    <div class="relative w-full h-full flex items-center justify-center animate-subtle-float">
                        <img id="flipbook-main-image" src="" alt="Product View" class="max-w-full max-h-full object-contain rounded-2xl drop-shadow-2xl transition-all duration-300 select-none" onerror="this.src='https://placehold.co/600x600/141418/e5e5e7?text=Loading'">
                    </div>

                    <!-- Stage Floating Actions -->
                    <div class="absolute top-4 right-4 flex space-x-2 opacity-90 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                        <button onclick="toggleSelectCurrentFlipbookImage()" id="flipbook-select-btn" title="Select Item" class="w-10 h-10 rounded-xl bg-surface/90 backdrop-blur-md text-zinc-300 hover:text-white flex items-center justify-center border border-zinc-700 shadow-lg transition">
                            <i id="flipbook-select-icon" class="fa-regular fa-square text-lg"></i>
                        </button>
                        <button onclick="downloadCurrentFlipbookImage()" title="Download Asset" class="w-10 h-10 rounded-xl bg-surface/90 backdrop-blur-md text-zinc-300 hover:text-white flex items-center justify-center border border-zinc-700 shadow-lg hover:bg-zinc-200 hover:text-black transition">
                            <i class="fa-solid fa-download"></i>
                        </button>
                        <button onclick="shareCurrentFlipbookImage()" title="Share Asset" class="w-10 h-10 rounded-xl bg-surface/90 backdrop-blur-md text-zinc-300 hover:text-white flex items-center justify-center border border-zinc-700 shadow-lg hover:bg-zinc-200 hover:text-black transition">
                            <i class="fa-solid fa-share"></i>
                        </button>
                    </div>

                    <!-- Navigation Arrows -->
                    <button onclick="prevFlipbookImage()" class="absolute left-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-2xl bg-surface/80 backdrop-blur-md text-zinc-200 hover:text-black hover:bg-zinc-200 border border-zinc-700/60 shadow-xl flex items-center justify-center transition opacity-80 group-hover:opacity-100">
                        <i class="fa-solid fa-chevron-left text-lg"></i>
                    </button>
                    <button onclick="nextFlipbookImage()" class="absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-2xl bg-surface/80 backdrop-blur-md text-zinc-200 hover:text-black hover:bg-zinc-200 border border-zinc-700/60 shadow-xl flex items-center justify-center transition opacity-80 group-hover:opacity-100">
                        <i class="fa-solid fa-chevron-right text-lg"></i>
                    </button>
                </div>

                <!-- Flipbook Controls & Batch Action trigger -->
                <div class="w-full max-w-xl flex items-center justify-between mt-4 px-2">
                    <div class="flex items-center space-x-2">
                        <button id="autoplay-btn" onclick="toggleAutoplay()" class="px-4 py-2 bg-surface hover:bg-zinc-800 text-zinc-300 rounded-xl border border-zinc-800 text-xs font-medium flex items-center space-x-2 transition">
                            <i id="autoplay-icon" class="fa-solid fa-play text-zinc-200"></i>
                            <span id="autoplay-text">Auto Play Loop</span>
                        </button>
                        <button onclick="resetFlipbook()" class="p-2.5 bg-surface hover:bg-zinc-800 text-zinc-300 rounded-xl border border-zinc-800 text-xs transition" title="Rewind">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>

                    <button onclick="openBatchModal()" class="px-4 py-2 bg-zinc-200 hover:bg-white text-black text-xs font-semibold rounded-xl transition shadow flex items-center space-x-2">
                        <i class="fa-solid fa-check-double"></i>
                        <span>Selected (<span id="selected-badge-count">0</span>)</span>
                    </button>
                </div>
            </div>

            <!-- Right Column: Filmstrip Drawer Index -->
            <div class="lg:col-span-5 flex flex-col h-[520px] bg-cardbg rounded-3xl border border-zinc-800/80 shadow-2xl p-6">
                <div class="flex items-center justify-between pb-4 border-b border-zinc-800">
                    <span class="font-medium text-white text-xs tracking-wider uppercase">Frame Index</span>
                    <span id="drawer-counter" class="text-xs font-mono text-zinc-400">0 selected</span>
                </div>
                <div id="filmstrip-container" class="flex-1 overflow-y-auto pr-1 py-4 grid grid-cols-4 gap-3">
                    <!-- Populated via JS -->
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-zinc-800/60 text-center text-xs text-zinc-500 bg-darkbg">
        <p class="tracking-widest uppercase">Pure Visual Catalog • 1:1 Aspect Ratio Full Fidelity</p>
    </footer>

    <!-- Batch Actions Modal (Only operates on user-selected items) -->
    <div id="batch-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-cardbg border border-zinc-800 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-zinc-800 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-semibold text-white uppercase tracking-wider">Selected Images (<span id="modal-selected-count">0</span>)</h3>
                </div>
                <button onclick="closeBatchModal()" class="w-9 h-9 rounded-xl bg-surface text-zinc-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="batch-modal-grid" class="p-6 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 gap-3 max-h-[50vh]">
                <!-- Selected items preview grid -->
            </div>
            <div class="p-4 bg-surface/80 border-t border-zinc-800 flex items-center justify-between">
                <button onclick="clearSelection()" class="text-xs text-red-400 hover:text-red-300 font-medium">Clear Selection</button>
                <div class="flex space-x-3">
                    <button onclick="downloadSelectedBatch()" class="px-4 py-2 bg-surface hover:bg-zinc-800 text-zinc-200 text-xs font-medium rounded-xl transition border border-zinc-700">Download Selected</button>
                    <button onclick="shareSelectedBatch()" class="px-4 py-2 bg-zinc-200 hover:bg-white text-black text-xs font-semibold rounded-xl transition shadow">Share Selected</button>
                </div>
            </div>
        </div>
    </div>

        let currentProductIdx = 0; // Default to contact page (index 0)

        let selectedMap = {}; // key: `${productIdx}-${imageIdx}` -> boolean

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const foundIdx = products.findIndex(p => p.id === hash);
                if (foundIdx !== -1) {
                    currentProductIdx = foundIdx;
                }
            }

            renderNavigation();
            loadProduct(currentProductIdx);

            window.addEventListener('keydown', (e) => {
                if (currentViewMode === 'flipbook' && !products[currentProductIdx].isContact) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextFlipbookImage();
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevFlipbookImage();
                }
            });
        });

        function renderNavigation() {
            const tabs = document.getElementById('product-tabs');
            tabs.innerHTML = '';

            products.forEach((prod, idx) => {
                const active = idx === currentProductIdx;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-2 rounded-xl text-xs font-medium tracking-wide transition flex items-center space-x-1.5 whitespace-nowrap ${active ? 'bg-zinc-200 text-black font-semibold shadow' : 'text-zinc-400 hover:text-white hover:bg-zinc-800'}`;
                
                if (prod.isContact) {
                    btn.innerHTML = `<i class="fa-solid fa-phone text-xs"></i><span>Contact</span>`;
                } else {
                    btn.innerHTML = `<span>${prod.name}</span>`;
                }

                btn.onclick = () => switchProduct(idx);
                tabs.appendChild(btn);
            });
        }

        function switchProduct(idx) {
            currentProductIdx = idx;
            currentFlipbookIdx = 0;
            if (isAutoplaying) toggleAutoplay();

            window.location.hash = products[idx].id;
            renderNavigation();
            loadProduct(idx);
        }

        function loadProduct(idx) {
            const prod = products[idx];
            const gridEl = document.getElementById('view-grid');
            const flipEl = document.getElementById('view-flipbook');
            const modeToggleWrapper = document.getElementById('view-mode-wrapper');

            if (prod.isContact) {
                modeToggleWrapper.style.display = 'none';
                gridEl.classList.remove('hidden');
                flipEl.classList.add('hidden');
                renderContactPage();
            } else {
                modeToggleWrapper.style.display = 'flex';
                if (currentViewMode === 'grid') {
                    gridEl.classList.remove('hidden');
                    flipEl.classList.add('hidden');
                    renderGrid();
                } else {
                    gridEl.classList.add('hidden');
                    flipEl.classList.remove('hidden');
                    flipEl.classList.add('grid');
                    renderFlipbook();
                }
                updateBatchBadge();
            }
        }

        function setViewMode(mode) {
            if (products[currentProductIdx].isContact) return;
            currentViewMode = mode;
            const gridEl = document.getElementById('view-grid');
            const flipEl = document.getElementById('view-flipbook');
            const gBtn = document.getElementById('mode-grid-btn');
            const fBtn = document.getElementById('mode-flipbook-btn');

            if (mode === 'grid') {
                gridEl.classList.remove('hidden');
                flipEl.classList.add('hidden');
                gBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-zinc-200 text-black font-semibold shadow";
                fBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-zinc-400 hover:text-white";
                if (isAutoplaying) toggleAutoplay();
            } else {
                gridEl.classList.add('hidden');
                flipEl.classList.remove('hidden');
                flipEl.classList.add('grid');
                fBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 bg-zinc-200 text-black font-semibold shadow";
                gBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 text-zinc-400 hover:text-white";
                renderFlipbook();
            }
        }

        // ================= GRID VIEW RENDERING =================
        function renderGrid() {
            const prod = products[currentProductIdx];
            const container = document.getElementById('grid-container');
            container.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4";
            container.innerHTML = '';

            prod.images.forEach((img, idx) => {
                const key = `${currentProductIdx}-${idx}`;
                const isSelected = !!selectedMap[key];

                const card = document.createElement('div');
                card.className = `relative aspect-square-box bg-cardbg rounded-2xl overflow-hidden border ${isSelected ? 'border-zinc-200 ring-2 ring-zinc-500/30' : 'border-zinc-800/80'} group shadow-lg hover:border-zinc-600 transition`;
                card.innerHTML = `
                    <img src="${img.thumb}" alt="asset" class="w-full h-full object-contain p-2 group-hover:scale-105 transition duration-300 pointer-events-none" onerror="this.src='https://placehold.co/400x400/141418/e5e5e7?text=Error'">
                    <div class="absolute top-2 left-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-mono text-zinc-300">#${idx + 1}</div>
                    
                    <!-- Checkbox selection for selective sharing / downloading -->
                    <button onclick="toggleGridSelection(${idx})" class="absolute top-2 right-2 w-7 h-7 rounded-lg bg-black/70 backdrop-blur-md flex items-center justify-center ${isSelected ? 'text-white bg-zinc-700 border border-zinc-500' : 'text-zinc-400 hover:text-white'} transition">
                        <i class="fa-solid ${isSelected ? 'fa-square-check' : 'fa-square'}"></i>
                    </button>

                    <!-- Hover Quick Actions Footer -->
                    <div class="absolute inset-x-2 bottom-2 bg-surface/95 backdrop-blur-md p-2 rounded-xl flex items-center justify-around opacity-0 group-hover:opacity-100 transition shadow-xl border border-zinc-700/50">
                        <button onclick="inspectInFlipbook(${idx})" title="Inspect" class="text-zinc-300 hover:text-white text-xs p-1 transition"><i class="fa-solid fa-eye"></i></button>
                        <button onclick="downloadSingle(${idx})" title="Download" class="text-zinc-300 hover:text-white text-xs p-1 transition"><i class="fa-solid fa-download"></i></button>
                        <button onclick="shareSingle(${idx})" title="Share" class="text-zinc-300 hover:text-white text-xs p-1 transition"><i class="fa-solid fa-share-nodes"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleGridSelection(idx) {
            const key = `${currentProductIdx}-${idx}`;
            selectedMap[key] = !selectedMap[key];
            renderGrid();
            renderFilmstrip();
            updateBatchBadge();
            showToast(selectedMap[key] ? `Item #${idx + 1} selected` : `Item #${idx + 1} unselected`, 'info');
        }

        function updateBatchBadge() {
            let count = 0;
            const prod = products[currentProductIdx];
            if (!prod.images) return;
            prod.images.forEach((_, idx) => {
                if (selectedMap[`${currentProductIdx}-${idx}`]) count++;
            });
            document.getElementById('selected-badge-count').innerText = count;
            document.getElementById('drawer-counter').innerText = `${count} selected`;
        }

        function clearSelection() {
            const prod = products[currentProductIdx];
            prod.images.forEach((_, idx) => {
                delete selectedMap[`${currentProductIdx}-${idx}`];
            });
            renderGrid();
            renderFilmstrip();
            updateBatchBadge();
            showToast("Selection cleared", 'info');
        }

        // ================= FLIPBOOK INSPECTOR RENDERING =================
        function renderFlipbook() {
            const prod = products[currentProductIdx];
            const imgObj = prod.images[currentFlipbookIdx];

            document.getElementById('flipbook-main-image').src = imgObj.thumb;
            document.getElementById('flipbook-counter').innerText = `${String(currentFlipbookIdx + 1).padStart(2, '0')} / ${String(prod.images.length).padStart(2, '0')}`;

            const key = `${currentProductIdx}-${currentFlipbookIdx}`;
            const selectIcon = document.getElementById('flipbook-select-icon');
            if (selectedMap[key]) {
                selectIcon.className = "fa-solid fa-square-check text-white text-lg";
            } else {
                selectIcon.className = "fa-regular fa-square text-lg";
            }

            renderFilmstrip();
        }

        function renderFilmstrip() {
            const prod = products[currentProductIdx];
            const container = document.getElementById('filmstrip-container');
            container.innerHTML = '';

            prod.images.forEach((img, idx) => {
                const key = `${currentProductIdx}-${idx}`;
                const isSelected = !!selectedMap[key];
                const isActive = idx === currentFlipbookIdx;

                const thumb = document.createElement('div');
                thumb.className = `filmstrip-item relative aspect-square-box bg-surface rounded-xl overflow-hidden border cursor-pointer transition group ${isActive ? 'ring-2 ring-zinc-200 border-transparent' : 'border-zinc-800 hover:border-zinc-600'}`;
                thumb.onclick = () => {
                    currentFlipbookIdx = idx;
                    renderFlipbook();
                };
                thumb.innerHTML = `
                    <img src="${img.thumb}" alt="thumb" class="w-full h-full object-cover group-hover:scale-105 transition pointer-events-none">
                    <div class="absolute top-1 left-1 bg-black/70 text-[9px] px-1 rounded font-mono text-zinc-300">${idx + 1}</div>
                    <div class="absolute top-1 right-1 text-[10px] ${isSelected ? 'text-zinc-200' : 'text-transparent group-hover:text-zinc-400'}">
                        <i class="fa-solid ${isSelected ? 'fa-check-circle' : 'fa-circle'}"></i>
                    </div>
                `;
                container.appendChild(thumb);
            });
        }

        function inspectInFlipbook(idx) {
            currentFlipbookIdx = idx;
            setViewMode('flipbook');
        }

        function nextFlipbookImage() {
            const prod = products[currentProductIdx];
            currentFlipbookIdx = (currentFlipbookIdx + 1) % prod.images.length;
            renderFlipbook();
        }

        function prevFlipbookImage() {
            const prod = products[currentProductIdx];
            currentFlipbookIdx = (currentFlipbookIdx - 1 + prod.images.length) % prod.images.length;
            renderFlipbook();
        }

        function resetFlipbook() {
            currentFlipbookIdx = 0;
            renderFlipbook();
            showToast("Rewound to start", "info");
        }

        function toggleAutoplay() {
            const icon = document.getElementById('autoplay-icon');
            const text = document.getElementById('autoplay-text');

            if (isAutoplaying) {
                clearInterval(autoplayTimer);
                isAutoplaying = false;
                icon.className = "fa-solid fa-play text-zinc-200";
                text.innerText = "Auto Play Loop";
                showToast("Auto play paused", "info");
            } else {
                isAutoplaying = true;
                icon.className = "fa-solid fa-pause text-zinc-200";
                text.innerText = "Pause";
                showToast("Auto play started", "success");
                autoplayTimer = setInterval(() => {
                    nextFlipbookImage();
                }, 2200);
            }
        }

        function toggleSelectCurrentFlipbookImage() {
            toggleGridSelection(currentFlipbookIdx);
            renderFlipbook();
        }

        // ================= DOWNLOAD & SELECTIVE SHARE UTILITIES =================
        function downloadSingle(idx) {
            const prod = products[currentProductIdx];
            const img = prod.images[idx];
            triggerDownload(img.thumb, `Asset_${img.id}.png`);
        }

        function downloadCurrentFlipbookImage() {
            downloadSingle(currentFlipbookIdx);
        }

        function downloadSelectedBatch() {
            const prod = products[currentProductIdx];
            let count = 0;
            prod.images.forEach((img, idx) => {
                if (selectedMap[`${currentProductIdx}-${idx}`]) {
                    count++;
                    setTimeout(() => {
                        triggerDownload(img.thumb, `Selected_${img.id}.png`);
                    }, count * 350);
                }
            });

            if (count === 0) {
                showToast("No images selected for download.", "error");
            } else {
                showToast(`Downloading ${count} selected assets...`, "success");
                closeBatchModal();
            }
        }

        function triggerDownload(url, filename) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                }).catch(() => {
                    window.open(url, '_blank');
                });
        }

        function shareSingle(idx) {
            const prod = products[currentProductIdx];
            const img = prod.images[idx];
            if (navigator.share) {
                navigator.share({
                    title: `Asset #${img.id}`,
                    text: `Check out this product image:`,
                    url: img.thumb
                }).catch(() => {});
            } else {
                copyToClipboard(img.thumb);
            }
        }

        function shareCurrentFlipbookImage() {
            shareSingle(currentFlipbookIdx);
        }

        function shareCurrentPage() {
            const shareUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Product Catalog',
                    text: 'Explore catalog page',
                    url: shareUrl
                }).catch(() => {});
            } else {
                copyToClipboard(shareUrl);
            }
        }

        function shareSelectedBatch() {
            const prod = products[currentProductIdx];
            const links = [];
            prod.images.forEach((img, idx) => {
                if (selectedMap[`${currentProductIdx}-${idx}`]) {
                    links.push(img.thumb);
                }
            });

            if (links.length === 0) {
                showToast("No images selected to share.", "error");
                return;
            }

            const text = `Selected Product Images:\n` + links.join('\n');
            if (navigator.share) {
                navigator.share({ title: `Selected Images`, text: text }).catch(() => {});
            } else {
                copyToClipboard(text);
            }
            closeBatchModal();
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("Selected image links copied to clipboard", "success");
            } catch (err) {
                showToast("Failed to copy", "error");
            }
            document.body.removeChild(textarea);
        }

        // ================= MODAL CONTROL =================
        function openBatchModal() {
            const prod = products[currentProductIdx];
            const grid = document.getElementById('batch-modal-grid');
            grid.innerHTML = '';

            let count = 0;
            prod.images.forEach((img, idx) => {
                if (selectedMap[`${currentProductIdx}-${idx}`]) {
                    count++;
                    const div = document.createElement('div');
                    div.className = "relative aspect-square-box bg-surface rounded-xl overflow-hidden border border-zinc-800";
                    div.innerHTML = `
                        <img src="${img.thumb}" alt="preview" class="w-full h-full object-cover">
                        <div class="absolute bottom-1 left-1 bg-black/70 px-1.5 rounded text-[9px] font-mono text-zinc-300">#${idx + 1}</div>
                    `;
                    grid.appendChild(div);
                }
            });

            document.getElementById('modal-selected-count').innerText = count;

            if (count === 0) {
                showToast("No images selected yet. Check boxes on images to select them.", "info");
                return;
            }

            document.getElementById('batch-modal').classList.remove('hidden');
            document.getElementById('batch-modal').classList.add('flex');
        }

        function closeBatchModal() {
            document.getElementById('batch-modal').classList.remove('flex');
            document.getElementById('batch-modal').classList.add('hidden');
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-surface border-zinc-800 text-zinc-200';
            if (type === 'success') bg = 'bg-zinc-900 border-zinc-700 text-zinc-100';
            if (type === 'error') bg = 'bg-red-950/90 border-red-500/30 text-red-200';

            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md text-xs font-medium flex items-center space-x-3 transition transform translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-zinc-300' : type === 'error' ? 'fa-circle-exclamation text-red-400' : 'fa-circle-info text-zinc-400'}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
