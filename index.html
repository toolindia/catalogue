<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0a',
                        cardbg: '#141414',
                        accent: '#d4af37'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.01); }
        }
        .animate-float {
            animation: floatAnim 6s ease-in-out infinite;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen font-sans antialiased selection:bg-accent selection:text-black">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-darkbg/95 backdrop-blur-md border-b border-neutral-800 px-4 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="switchView('landing')" class="text-xl font-bold tracking-wider uppercase flex items-center gap-2 hover:text-accent transition">
                <i class="fa-solid fa-shapes text-accent"></i> Catalog
            </button>
        </div>

        <!-- Contact Quick Actions & Global PDF Button -->
        <div class="flex items-center gap-3">
            <button onclick="downloadPDF()" class="bg-red-600/90 hover:bg-red-600 text-white text-xs md:text-sm px-3.5 py-2 rounded-full flex items-center gap-2 transition shadow-lg shadow-red-900/20">
                <i class="fa-solid fa-file-pdf"></i>
                <span class="hidden sm:inline">Download PDF</span>
            </button>
            <a href="tel:+918527341413" class="bg-neutral-900 border border-neutral-700 hover:border-accent text-xs md:text-sm px-3.5 py-2 rounded-full flex items-center gap-2 transition">
                <i class="fa-solid fa-phone text-accent"></i>
                <span class="hidden sm:inline">+91 85273 41413</span>
            </a>
            <a href="https://wa.me/918527341413" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm px-3.5 py-2 rounded-full flex items-center gap-2 transition shadow-lg shadow-emerald-900/20">
                <i class="fa-brands fa-whatsapp text-base"></i>
                <span class="hidden sm:inline">WhatsApp</span>
            </a>
        </div>
    </header>

    <!-- Main Wrapper -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- LANDING VIEW -->
        <div id="landing-view" class="space-y-12">
            <!-- Contact Hero Section -->
            <section class="text-center py-12 px-4 rounded-3xl bg-gradient-to-b from-neutral-900 to-cardbg border border-neutral-800 relative overflow-hidden">
                <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:16px_16px]"></div>
                <div class="relative z-10 max-w-xl mx-auto space-y-6">
                    <span class="text-xs uppercase tracking-widest px-3 py-1 rounded-full bg-neutral-800 text-accent border border-neutral-700">Direct Contact</span>
                    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">Get in Touch</h1>
                    <p class="text-neutral-400 text-sm md:text-base">For orders, questions, or assistance, contact us directly via phone or WhatsApp.</p>
                    <div class="flex flex-wrap justify-center gap-4 pt-4">
                        <a href="tel:+918527341413" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 px-6 py-3.5 rounded-xl font-medium flex items-center gap-3 transition">
                            <i class="fa-solid fa-phone text-accent text-lg"></i> +91 85273 41413
                        </a>
                        <a href="https://wa.me/918527341413" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3.5 rounded-xl font-medium flex items-center gap-3 transition shadow-lg shadow-emerald-900/30">
                            <i class="fa-brands fa-whatsapp text-xl"></i> Chat on WhatsApp
                        </a>
                    </div>
                </div>
            </section>

            <!-- Catalog Gallery Grid -->
            <div class="space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h2 class="text-xl font-semibold tracking-wide">All Photos</h2>
                    <div class="flex items-center gap-2">
                        <span id="total-count" class="text-xs text-neutral-400 bg-neutral-900 px-3 py-1 rounded-full border border-neutral-800"></span>
                        <button onclick="shareSelected()" class="bg-accent text-black hover:bg-amber-400 text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1.5">
                            <i class="fa-solid fa-share-nodes"></i> Share Selected (<span id="global-selected-count">0</span>)
                        </button>
                    </div>
                </div>
                <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Images rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- VIEWER / FLIPBOOK DETAIL VIEW -->
        <div id="viewer-view" class="hidden space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <button onclick="switchView('landing')" class="text-sm bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 px-4 py-2 rounded-xl flex items-center gap-2 transition">
                    <i class="fa-solid fa-arrow-left"></i> Back to Gallery
                </button>
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-500 text-white text-xs md:text-sm px-4 py-2 rounded-xl font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-file-pdf"></i> PDF (<span id="pdf-btn-count">All</span>)
                    </button>
                    <button onclick="shareSelected()" class="bg-accent text-black hover:bg-amber-400 text-xs md:text-sm px-4 py-2 rounded-xl font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-share-nodes"></i> Share (<span id="viewer-selected-count">0</span>)
                    </button>
                    <button onclick="downloadSelected()" class="bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-xs md:text-sm px-4 py-2 rounded-xl font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-download"></i> Download Images
                    </button>
                </div>
            </div>

            <!-- Main Stage Viewer Box -->
            <div class="bg-cardbg border border-neutral-800 rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center relative min-h-[480px] shadow-2xl">
                <div class="absolute top-4 left-4 z-10 flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-xl border border-neutral-700">
                    <input type="checkbox" id="current-select-checkbox" onchange="toggleCurrentSelection()" class="w-5 h-5 accent-accent rounded cursor-pointer">
                    <label for="current-select-checkbox" class="text-xs text-neutral-300 cursor-pointer select-none font-medium">Select this image</label>
                </div>

                <div class="w-full max-w-lg aspect-square flex items-center justify-center relative overflow-hidden rounded-2xl animate-float">
                    <img id="stage-img" src="" alt="Product View" class="w-full h-full object-contain drop-shadow-2xl">
                </div>

                <!-- Navigation Controls -->
                <div class="flex items-center justify-between w-full max-w-md mt-6">
                    <button onclick="prevImage()" class="w-12 h-12 rounded-full bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <span id="stage-counter" class="text-sm font-mono text-neutral-400">1 / 1</span>
                    <button onclick="nextImage()" class="w-12 h-12 rounded-full bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 flex items-center justify-center text-lg transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Filmstrip Thumbnails Drawer -->
            <div class="space-y-3">
                <h3 class="text-xs uppercase tracking-widest text-neutral-400">Sequence Strip</h3>
                <div id="filmstrip" class="flex gap-3 overflow-x-auto pb-3 pt-1">
                    <!-- Thumbnails rendered dynamically -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-800 mt-20 py-8 text-center text-xs text-neutral-500">
        <p>&copy; 2026 Catalog & Gallery. All rights reserved.</p>
    </footer>

        let selectedItems = new Set();
        let currentIndex = 0;

        document.getElementById('total-count').innerText = `${imagesData.length} Items`;

        function renderGrid() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            imagesData.forEach((img, idx) => {
                const isSelected = selectedItems.has(idx);
                const card = document.createElement('div');
                card.className = `group relative bg-cardbg rounded-2xl border ${isSelected ? 'border-accent ring-2 ring-accent/30' : 'border-neutral-800'} overflow-hidden aspect-square flex items-center justify-center p-3 cursor-pointer hover:border-neutral-600 transition`;
                card.innerHTML = `
                    <div class="absolute top-2 right-2 z-10" onclick="event.stopPropagation(); toggleSelect(${idx})">
                        <div class="w-6 h-6 rounded-full ${isSelected ? 'bg-accent text-black' : 'bg-black/60 border border-neutral-600 text-transparent'} flex items-center justify-center text-xs transition shadow">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                    <img src="${img.url}" alt="${img.alt}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" onclick="openViewer(${idx})">
                `;
                grid.appendChild(card);
            });
            updateCounts();
        }

        function updateCounts() {
            document.getElementById('global-selected-count').innerText = selectedItems.size;
            document.getElementById('viewer-selected-count').innerText = selectedItems.size;
            const pdfCountText = selectedItems.size > 0 ? `Selected (${selectedItems.size})` : 'All';
            document.getElementById('pdf-btn-count').innerText = pdfCountText;
        }

        function toggleSelect(idx) {
            if (selectedItems.has(idx)) {
                selectedItems.delete(idx);
            } else {
                selectedItems.add(idx);
            }
            renderGrid();
        }

        function toggleCurrentSelection() {
            toggleSelect(currentIndex);
        }

        function openViewer(idx) {
            currentIndex = idx;
            document.getElementById('landing-view').classList.add('hidden');
            document.getElementById('viewer-view').classList.remove('hidden');
            updateStage();
            renderFilmstrip();
        }

        function switchView(view) {
            if (view === 'landing') {
                document.getElementById('viewer-view').classList.add('hidden');
                document.getElementById('landing-view').classList.remove('hidden');
                renderGrid();
            }
        }

        function updateStage() {
            const item = imagesData[currentIndex];
            document.getElementById('stage-img').src = item.url;
            document.getElementById('stage-counter').innerText = `${currentIndex + 1} / ${imagesData.length}`;
            document.getElementById('current-select-checkbox').checked = selectedItems.has(currentIndex);
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % imagesData.length;
            updateStage();
            scrollToThumbnail();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + imagesData.length) % imagesData.length;
            updateStage();
            scrollToThumbnail();
        }

        function renderFilmstrip() {
            const strip = document.getElementById('filmstrip');
            strip.innerHTML = '';
            imagesData.forEach((img, idx) => {
                const isSelected = selectedItems.has(idx);
                const thumb = document.createElement('div');
                thumb.className = `flex-shrink-0 w-16 h-16 rounded-xl border ${idx === currentIndex ? 'border-accent ring-2 ring-accent/30' : 'border-neutral-800'} overflow-hidden bg-neutral-900 cursor-pointer relative transition`;
                thumb.id = `thumb-${idx}`;
                thumb.innerHTML = `
                    <img src="${img.url}" class="w-full h-full object-contain p-1">
                    ${isSelected ? '<div class="absolute top-1 right-1 w-3 h-3 bg-accent rounded-full"></div>' : ''}
                `;
                thumb.onclick = () => {
                    currentIndex = idx;
                    updateStage();
                    renderFilmstrip();
                };
                strip.appendChild(thumb);
            });
        }

        function scrollToThumbnail() {
            renderFilmstrip();
            const el = document.getElementById(`thumb-${currentIndex}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        async function shareSelected() {
            if (selectedItems.size === 0) {
                alert("Please select at least one image to share.");
                return;
            }
            const urls = Array.from(selectedItems).map(idx => imagesData[idx].url);
            const textString = "Check out these selected product photos:\n" + urls.join('\n');

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Product Catalog Images',
                        text: textString
                    });
                } catch (err) {
                    console.log('Share canceled');
                }
            } else {
                navigator.clipboard.writeText(textString);
                alert("Selected image links copied to clipboard!");
            }
        }

        function downloadSelected() {
            if (selectedItems.size === 0) {
                alert("Please select at least one image to download.");
                return;
            }
            selectedItems.forEach(idx => {
                const img = imagesData[idx];
                const a = document.createElement('a');
                a.href = img.url;
                a.download = `product-${img.alt}.png`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        }

        // Helper to load image as base64 for PDF generation
        function getBase64Image(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = function () {
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    const dataURL = canvas.toDataURL("image/png");
                    resolve(dataURL);
                };
                img.onerror = function (error) {
                    reject(error);
                };
                img.src = url;
            });
        }

        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Determine target items (selected or all)
            let targets = [];
            if (selectedItems.size > 0) {
                targets = Array.from(selectedItems).map(idx => imagesData[idx]);
            } else {
                targets = imagesData; // default all if none selected
            }

            // Show simple loading alert
            const btnText = event.target.innerText;
            alert(`Generating PDF for ${targets.length} images. Please wait a moment...`);

            for (let i = 0; i < targets.length; i++) {
                try {
                    if (i > 0) {
                        doc.addPage();
                    }
                    const base64Img = await getBase64Image(targets[i].url);
                    
                    // Add header text
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(14);
                    doc.text(`Catalog Item: ${targets[i].alt}`, 15, 15);
                    
                    // Add contact info footer/header
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(10);
                    doc.setTextColor(100);
                    doc.text("Contact: +91 85273 41413", 15, 285);

                    // Add image centered in page (1:1 square ratio fit)
                    doc.addImage(base64Img, 'PNG', 25, 30, 160, 160);
                } catch (e) {
                    console.error("Error processing image for PDF: ", targets[i].url);
                }
            }

            doc.save("product-catalog.pdf");
        }

        // Initialize grid on load
        renderGrid();
    </script>
